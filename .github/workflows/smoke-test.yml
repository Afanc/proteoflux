name: Scientific tests

on:
  workflow_dispatch:
    inputs:
      run_slow:
        description: Also validate multiprocessing permutation determinism
        type: boolean
        default: false
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.bib"
      - "docs/**"
      - "assets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.bib"
      - "docs/**"
      - "assets/**"
jobs:
  scientific-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Existing release/smoke versions; the Python >=3.10 package floor
        # does not imply scientific regression validation on Python 3.10.
        python-version: ["3.11", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      POLARS_MAX_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/constraints.txt

      - name: Install reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c tests/constraints.txt -e '.[dev]'
          python -m pip check

      - name: Fast algorithms and configuration contracts
        run: python -m pytest tests/unit tests/contracts/test_inputs_and_config.py --durations=15 --junitxml=core-results.xml

      - name: Scientific workflows and serialization contracts
        run: python -m pytest tests/integration tests/contracts/test_results.py tests/contracts/test_reference_comparison.py --durations=15 --junitxml=workflow-results.xml

      - name: Optional worker-count validation
        if: github.event_name == 'workflow_dispatch' && inputs.run_slow
        run: python -m pytest tests/integration/test_slow_phosx.py --run-slow --durations=15 --junitxml=slow-results.xml

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: '*-results.xml'
