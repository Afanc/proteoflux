dataset:
  input_file: "your_inputfile.tsv"
  input_layout: "long"
  analysis_type: "pelsa"
  annotation_file: "your_annotationfile.tsv"
  exclude_runs: null

  peptide_seq_column: "FG.LabeledSequence"
  index_column: "PG.ProteinGroups"
  signal_column: "FG.MS2RawQuantity"
  qvalue_column: "FG.Qvalue"
  charge_column: "FG.Charge"
  pep_column: "EG.PEP"

  filename_column: "R.FileName"
  condition_column: "R.Condition"
  replicate_column: "R.Replicate"
  precursors_exp_column: null

  fasta_column: "PG.FastaHeaders"
  protein_descriptions_column: "PG.ProteinDescriptions"
  gene_names_column: "PG.Genes"
  uniprot_column: "PG.ProteinGroups"
  ibaq_column: null
  protein_weight_column: "PG.MolecularWeight"

preprocessing:
  collapse_met_oxidation: true
  collapse_all_ptms: false
  protein_rollup_method: null
  peptide_rollup_method: "sum"
  directlfq_cores: 8
  directlfq_min_nonan: 1
  filtering:
    qvalue: 0.01
    pep: 0.05
    min_precursors: null
    min_linear_intensity: 2
    contaminants_files: null
  normalization:
    method:
      - "log2"
      - "median_equalization"
    reference_tag:
  imputation:
    method: null

analysis:
  only_against: null
  only_contrasts: null
  separate_contrasts: null
  batch_effect_columns: null
  clustering_max: 8000
  pelsa:
    concentration_column: "Concentration"
    control_concentration: 0.0
    min_control_points: 2
    fit_loss: huber
    fit_huber_delta: 0.5
    fit_steps: 300
    fit_lr: 0.03
    fit_batch_size: 4096
    fit_n_starts: 5
    bounds:
      pec50_margin_log10: 0.0
      slope: [0.01, 10.0]
      front: [-15.0, 15.0]
      back: [-15.0, 15.0]
      response_margin_fraction: 0.0

exports:
  path_h5ad: "proteoflux_results.h5ad"
  path_table: "proteoflux_table.xlsx"
  path_pdf_report: "proteoflux_report.pdf"
  pdf_report:
    volcano_top_annotated: 20
    volcano_sign_threshold: 0.05
    volcano_annotate_infinite: false
    title: "Proteoflux Analysis Report"
    intro_text: |
      This report summarizes the pelsa analysis pipeline applied to your dataset.
      We performed filtering to remove low-confidence identifications and contaminants, normalized intensities,
      fit 4PL curves, and tested the fits with a Fisher's test.
    footer_text: "Proteomics Core Facility - Biozentrum - University of Basel"
